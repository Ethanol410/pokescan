# Copie dans le dépôt les fichiers d'onnxruntime-web (moteur du modèle de vision), pour que
# l'appli les serve elle-même (hors ligne, sans dépendre d'un CDN). À lancer à la main.
name: Fichiers onnxruntime-web
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version d'onnxruntime-web"
        default: "1.19.2"
permissions:
  contents: write
jobs:
  vendor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          mkdir -p tmp vendor/ort && cd tmp
          npm pack onnxruntime-web@${{ inputs.version }} 2>&1 | tail -3
          tar xzf onnxruntime-web-*.tgz
          ls -la package/dist > ../vendor/ort/DIST.txt
          for f in ort.wasm.min.js ort-wasm-simd-threaded.wasm ort-wasm-simd-threaded.mjs; do cp package/dist/$f ../vendor/ort/ || echo "manque $f" >> ../vendor/ort/DIST.txt; done
          cp package/LICENSE ../vendor/ort/LICENSE || true
          echo "${{ inputs.version }}" > ../vendor/ort/VERSION
          cd .. && rm -rf tmp
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add vendor/ort && git commit -m "onnxruntime-web ${{ inputs.version }}" && git pull --rebase origin main && git push
